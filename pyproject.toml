[project]
name = "endonav-agent"
version = "0.1.0"
description = "Autonomous kidney stone treatment agent for endonav-sim"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "imageio[ffmpeg]>=2.31",
    "flask>=3.0",
    "requests>=2.31",
    "endonav-sim",
]

[tool.uv.sources]
endonav-sim = { path = "../endonav-sim", editable = true }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["endonav*"]
